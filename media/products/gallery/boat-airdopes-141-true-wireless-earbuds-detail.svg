<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FEF2F2;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <circle cx="250" cy="250" r="180" fill="#FFFFFF" opacity="0.6"/>

  <!-- Top Badge / Brand Header -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#DC2626"/>
    <text x="50" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ZOOM DETAIL</text>
    <text x="115" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">boAt</text>
  </g>

  <!-- Center Product Illustration with Shadow -->
  <g filter="url(#shadow)">
    
        <!-- boAt Airdopes 141 Case & Buds -->
        <g transform="translate(170, 170)">
          <!-- Charging Case -->
          <rect x="20" y="40" width="120" height="90" rx="35" fill="#18181B" stroke="#27272A" stroke-width="3"/>
          <circle cx="80" cy="85" r="5" fill="#22C55E"/>
          <!-- Left Earbud -->
          <circle cx="50" cy="15" r="18" fill="#DC2626"/>
          <rect x="45" y="25" width="10" height="30" rx="5" fill="#18181B"/>
          <!-- Right Earbud -->
          <circle cx="110" cy="15" r="18" fill="#DC2626"/>
          <rect x="105" y="25" width="10" height="30" rx="5" fill="#18181B"/>
        </g>
        
  </g>

  <!-- Bottom Details Overlay -->
  <rect x="30" y="420" width="440" height="50" rx="10" fill="#FFFFFF" opacity="0.95"/>
  <text x="45" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">boAt Airdopes 141 True Wi (Detail View)</text>
  <text x="45" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Close-Up Material & Build Texture</text>
  <rect x="400" y="430" width="60" height="30" rx="6" fill="#F1F5F9"/>
  <text x="430" y="450" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#DC2626" text-anchor="middle">OFFICIAL</text>
</svg>