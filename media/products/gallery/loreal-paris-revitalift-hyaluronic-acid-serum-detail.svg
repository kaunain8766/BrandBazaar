<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F0FDF4;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <circle cx="250" cy="250" r="180" fill="#FFFFFF" opacity="0.6"/>

  <!-- Top Badge / Brand Header -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#2563EB"/>
    <text x="50" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ZOOM DETAIL</text>
    <text x="115" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">L'Oréal Paris</text>
  </g>

  <!-- Center Product Illustration with Shadow -->
  <g filter="url(#shadow)">
    
        <!-- Skincare Serum Dropper Bottle -->
        <g transform="translate(180, 150)">
          <!-- Glass Dropper Bulb -->
          <path d="M60 40 Q70 10 70 0 Q70 10 80 40 Z" fill="#CBD5E1"/>
          <rect x="52" y="40" width="36" height="20" rx="3" fill="#94A3B8"/>
          <!-- Glass Bottle -->
          <rect x="35" y="65" width="70" height="150" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="3"/>
          <rect x="42" y="95" width="56" height="85" rx="4" fill="#EFF6FF"/>
          <!-- Serum droplet -->
          <circle cx="70" cy="130" r="14" fill="#60A5FA" opacity="0.8"/>
          <text x="70" y="160" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1E3A8A" text-anchor="middle">1.5% HA</text>
        </g>
        
  </g>

  <!-- Bottom Details Overlay -->
  <rect x="30" y="420" width="440" height="50" rx="10" fill="#FFFFFF" opacity="0.95"/>
  <text x="45" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">L'Oréal Paris Revitalift  (Detail View)</text>
  <text x="45" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Close-Up Material & Build Texture</text>
  <rect x="400" y="430" width="60" height="30" rx="6" fill="#F1F5F9"/>
  <text x="430" y="450" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2563EB" text-anchor="middle">OFFICIAL</text>
</svg>