<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E2E8F0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#CBD5E1;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <circle cx="250" cy="250" r="180" fill="#FFFFFF" opacity="0.6"/>

  <!-- Top Badge / Brand Header -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#475569"/>
    <text x="50" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BOX PACK</text>
    <text x="115" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#475569">Nike</text>
  </g>

  <!-- Center Product Illustration with Shadow -->
  <g filter="url(#shadow)">
    
        <!-- Nike Zoom Pegasus 40 Silhouette -->
        <g transform="translate(100, 190) scale(1.1)">
          <!-- Aerodynamic Sole -->
          <path d="M20 100 Q150 120 260 85 Q265 110 245 125 Q130 135 20 120 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
          <!-- Zoom Air Cushion Accent -->
          <rect x="140" y="105" width="45" height="12" rx="4" fill="#38BDF8"/>
          <!-- Shoe Upper -->
          <path d="M30 100 Q65 30 130 50 L200 65 Q255 75 260 85 Q135 95 30 100 Z" fill="#0F172A"/>
          <!-- Vibrant Swoosh -->
          <path d="M70 90 Q140 55 200 80 Q130 80 80 92 Z" fill="#38BDF8"/>
        </g>
        
  </g>

  <!-- Bottom Details Overlay -->
  <rect x="30" y="420" width="440" height="50" rx="10" fill="#FFFFFF" opacity="0.95"/>
  <text x="45" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Nike Air Zoom Pegasus 40  (Packaging)</text>
  <text x="45" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Official Retail Sealed Box</text>
  <rect x="400" y="430" width="60" height="30" rx="6" fill="#F1F5F9"/>
  <text x="430" y="450" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">OFFICIAL</text>
</svg>